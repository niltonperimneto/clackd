# clackd — dependency manifest
#
# Mission 1 scope: dependencies block only. The [package] stanza is
# intentionally omitted and will be added by the supervisor wiring mission
# alongside src/main.rs.
#
# Why these crates, and not others:
#
# - tokio: Single async runtime for the entire daemon. Feature set is the
#   minimum required across the planned module tree:
#     * rt-multi-thread, macros: #[tokio::main] supervisor.
#     * sync: mpsc + oneshot channels for the actor pattern (SKILLS.md §1.1).
#     * time: timeout deadlines and exponential-backoff sleeps (SKILLS.md §2.2).
#     * io-util: AsyncReadExt / AsyncWriteExt helpers for AsyncFd consumers.
#     * net: pulled in transitively by AsyncFd; declared explicitly so the
#       feature graph is auditable.
#     * fs: ONLY for XDG_DATA_HOME path materialization in the legacy shadow
#       cache (CLAUDE.md §4.2). Tokio fs is FORBIDDEN for hidraw character
#       devices — see CLAUDE.md §4.1.
#     * signal: SIGTERM/SIGINT handling in the supervisor.
#
# - zbus: Session-bus IPC frontend (CLAUDE.md §5). default-features = false
#   plus the "tokio" feature keeps the runtime single — avoids dragging in
#   async-io / async-executor, which would fork the executor model.
#
# - thiserror: Derives for DriverError / DaemonError. Zero runtime cost; the
#   error boundary in CLAUDE.md §3.3 mandates well-typed enums, not anyhow.
#
# - tracing: Structured logging. Required by CLAUDE.md §4.1 ("logged at INFO
#   level on activation" of the coalescing buffer); also the supervisor and
#   reconnection backoff path needs spans.
#
# - serde / serde_json: Legacy shadow-state persistence to
#   $XDG_DATA_HOME/clackd/<device_id>.json (CLAUDE.md §4.2). Not used by the
#   VIA driver.
#
# - async-trait: Required by the KeyboardDriver trait (CLAUDE.md §3.2).
#   Acknowledged debt — each call boxes a future. Migration to native async
#   fn in traits (RPITIT) is gated on MSRV ≥ 1.75 per the architecture's
#   migration note; revisit once bulk-remap throughput becomes the bottleneck.
#
# Deliberately deferred to the missions that need them (NOT added speculatively):
#   tokio-udev, nix, xdg / directories, zerocopy, polkit bindings.

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
thiserror = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
