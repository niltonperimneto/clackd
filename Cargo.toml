# clackd — dependency manifest
#
# Mission 1 scope: dependencies block only. The [package] stanza is
# intentionally omitted and will be added by the supervisor wiring mission
# alongside src/main.rs.
#
# Why these crates, and not others:
#
# - tokio: Single async runtime for the entire daemon. Feature set is the
#   minimum required across the planned module tree:
#     * rt-multi-thread, macros: #[tokio::main] supervisor.
#     * sync: mpsc + oneshot channels for the actor pattern (SKILLS.md §1.1).
#     * time: timeout deadlines and exponential-backoff sleeps (SKILLS.md §2.2).
#     * io-util: AsyncReadExt / AsyncWriteExt helpers for AsyncFd consumers.
#     * net: pulled in transitively by AsyncFd; explicitly declared.
#     * fs: ONLY for XDG_DATA_HOME path materialization. Tokio fs is FORBIDDEN for hidraw.
#     * signal: SIGTERM/SIGINT handling.
#
# - zbus: Session-bus IPC frontend. default-features = false, tokio feature keeps runtime single.
# - thiserror: Derives for DriverError / DaemonError.
# - tracing: Structured logging.
# - tracing-subscriber: Structured log sink registration.
# - serde / serde_json: Legacy shadow-state persistence.
# - async-trait: Required by KeyboardDriver trait.


[package]
name = "clackd"
version = "0.0.4"
edition = "2024"
rust-version = "1.96.0"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal", "test-util"] }
tokio-stream = "0.1.18"
tokio-udev = "0.10"
nix = { version = "0.31", features = ["fs", "ioctl"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
# sd-notify: emit READY=1 / STOPPING=1 to systemd when running under
# Type=notify. When NOTIFY_SOCKET is unset (non-systemd runs), every call
# is a cheap no-op — no conditional compilation required.
sd-notify = "0.5"
toml = "1.1.2"
directories = "6"
# clap: argument parser for the `clackctl` CLI binary (src/bin/clackctl.rs).
# Only the CLI uses it; the daemon does not. Shared at the package level.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
